<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アトリエ｜kichi.page</title>
<meta name="description" content="動くアート、AIアート、物語、絵本。思いつくままにつくったものを並べていくアトリエです。">
<style>
  :root {
    --bg: #f3efe8;
    --wall: #fbf9f5;
    --ink: #2a2622;
    --sub: #8a8075;
    --line: #e2dbd0;
    --frame: #3a332c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161413; --wall: #1f1c1a; --ink: #ede6dc; --sub: #a39889;
      --line: #36302b; --frame: #c9bba8;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    line-height: 1.9;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 64px 16px 72px; }

  header { text-align: center; }
  .eyebrow { font-size: 12px; letter-spacing: .4em; color: var(--sub); }
  h1 { margin-top: 8px; font-size: 32px; font-weight: 500; letter-spacing: .3em; }

  /* 展示室の壁 */
  .gallery {
    margin-top: 56px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 28px;
    list-style: none;
  }
  .piece { text-align: center; }
  .frame {
    aspect-ratio: 4 / 3;
    display: grid; place-items: center;
    background: var(--wall);
    border: 1px solid var(--line);
    outline: 6px solid var(--wall);
    box-shadow: 0 0 0 7px var(--frame), 0 14px 28px rgba(0,0,0,.12);
    margin: 7px;
  }
  .frame svg { width: 46%; height: auto; opacity: .55; }
  .piece b { display: block; margin-top: 22px; font-size: 17px; font-weight: 500; letter-spacing: .1em; }
  .piece span { display: block; color: var(--sub); font-size: 13px; }
  a.piece { color: inherit; text-decoration: none; }
  a.piece .frame { transition: transform .4s ease, box-shadow .4s ease; }
  a.piece:hover .frame { transform: translateY(-3px); box-shadow: 0 0 0 7px var(--frame), 0 20px 36px rgba(0,0,0,.18); }
  .frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .open {
    display: inline-block; margin-top: 6px; padding: 0 12px;
    border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink);
    font-size: 12px; letter-spacing: .2em;
  }
  .soon {
    display: inline-block; margin-top: 6px; padding: 0 12px;
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    color: var(--sub); font-size: 12px; letter-spacing: .2em;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="eyebrow">ATELIER</p>
    <h1>アトリエ</h1>
  </header>

  <ul class="gallery">
    <li>
      <a class="piece" href="/sumi/">
        <div class="frame"><img src="/sumi/img/card.jpg" width="480" height="360" alt="水墨画「寒江」の一部。白い広がりに小舟と遠い雪の山。" loading="lazy"></div>
        <b>墨</b>
        <span>絵の中に入り、音を聴く。水墨画の展示室</span>
        <span class="open">ひらく</span>
      </a>
    </li>
    <li class="piece">
      <div class="frame" aria-hidden="true">
        <svg viewBox="0 0 100 60" fill="none" stroke="currentColor" stroke-width="2"><path d="M0 40 Q25 20 50 40 T100 40"/><path d="M0 50 Q25 32 50 50 T100 50"/><circle cx="74" cy="16" r="7"/></svg>
      </div>
      <b>動くアート</b>
      <span>コードで描く、ゆっくり変わり続ける絵</span>
      <span class="soon">準備中</span>
    </li>
    <li>
      <a class="piece" href="/ai/">
        <div class="frame"><img src="/ai/hikari/card.jpg" width="480" height="360" alt="暗い背景に浮かぶ、光の粒でできたクラゲ。青いかさから細い触手が垂れている。" loading="lazy"></div>
        <b>AIアート</b>
        <span>AIと一緒に描いた絵と映像のギャラリー</span>
        <span class="open">ひらく</span>
      </a>
    </li>
    <li class="piece">
      <div class="frame" aria-hidden="true">
        <svg viewBox="0 0 100 60" fill="none" stroke="currentColor" stroke-width="2"><path d="M50 12 L50 52"/><path d="M50 12 Q34 6 20 12 L20 52 Q34 46 50 52"/><path d="M50 12 Q66 6 80 12 L80 52 Q66 46 50 52"/></svg>
      </div>
      <b>物語</b>
      <span>夜に読む、短いおはなし</span>
      <span class="soon">準備中</span>
    </li>
    <li class="piece">
      <div class="frame" aria-hidden="true">
        <svg viewBox="0 0 100 60" fill="none" stroke="currentColor" stroke-width="2"><circle cx="38" cy="30" r="12"/><circle cx="64" cy="34" r="8"/><path d="M14 52 L86 52"/><path d="M30 18 L26 10 M46 18 L50 10"/></svg>
      </div>
      <b>絵本</b>
      <span>小さな子と指差しながら読む絵本の試作</span>
      <span class="soon">準備中</span>
    </li>
  </ul>

</div>
</body>
</html>
